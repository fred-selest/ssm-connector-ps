name: Release

# Deux façons de publier une version :
#   - pousser un tag vX.Y.Z (ligne de commande) : la release est créée par le workflow ;
#   - publier une release depuis l'interface GitHub (qui crée aussi le tag) : le workflow
#     joint l'archive à la release existante.
# Un même tag peut déclencher les deux événements : les exécutions sont donc
# sérialisées par tag et l'envoi de l'archive est idempotent.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Tests (PHP 8.1, la version minimale annoncée)
        run: docker run --rm -v "$PWD":/app -w /app php:8.1-cli php tests/run.php 2>/dev/null

      - name: Vérifier que le tag correspond à la version du module
        run: |
          module_version=$(sed -n "s/.*\$this->version = '\([0-9.]*\)'.*/\1/p" ssmconnector.php)
          config_version=$(sed -n 's/.*<version><!\[CDATA\[\([0-9.]*\)\]\]><\/version>.*/\1/p' config.xml)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag module=$module_version config.xml=$config_version"
          [ "$tag" = "$module_version" ] && [ "$tag" = "$config_version" ]

      - name: Construire l'archive du module
        run: git archive --prefix=ssmconnector/ -o ssmconnector.zip HEAD

      - name: Notes de version (section du CHANGELOG)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          echo "notes: $(wc -l < notes.md) lignes"

      - name: Publier l'archive sur la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ssmconnector.zip --clobber
          elif [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" ssmconnector.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" ssmconnector.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
