name: Release

# Trois façons de publier une version :
#   - Actions › Release › Run workflow, avec le numéro (ex. 0.4.2), depuis la branche main : le workflow crée le tag
#     vX.Y.Z sur le dernier commit de main et la release ;
#   - pousser un tag vX.Y.Z (ligne de commande) : la release est créée par le workflow ;
#   - publier une release depuis l'interface GitHub (qui crée aussi le tag) : le workflow
#     joint l'archive à la release existante.
# Un même tag peut déclencher plusieurs événements : les exécutions sont donc
# sérialisées par tag et l'envoi de l'archive est idempotent.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.4.2)"
        required: true
        type: string
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Lancement manuel — branche main, numéro valide, tag libre
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Lancer ce workflow sur la branche main (actuel : $GITHUB_REF)." >&2
            exit 1
          fi
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version invalide : attendu X.Y.Z" >&2; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Le tag v$VERSION existe déjà." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Tests (PHP 8.1, la version minimale annoncée)
        run: docker run --rm -v "$PWD":/app -w /app php:8.1-cli php tests/run.php 2>/dev/null

      - name: Vérifier que le tag correspond à la version du module
        run: |
          module_version=$(sed -n "s/.*\$this->version = '\([0-9.]*\)'.*/\1/p" ssmconnector.php)
          config_version=$(sed -n 's/.*<version><!\[CDATA\[\([0-9.]*\)\]\]><\/version>.*/\1/p' config.xml)
          tag="${TAG#v}"
          echo "tag=$tag module=$module_version config.xml=$config_version"
          [ "$tag" = "$module_version" ] && [ "$tag" = "$config_version" ]

      - name: Construire l'archive du module
        run: git archive --prefix=ssmconnector/ -o ssmconnector.zip HEAD

      - name: Notes de version (section du CHANGELOG)
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          echo "notes: $(wc -l < notes.md) lignes"

      - name: Publier l'archive sur la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ssmconnector.zip --clobber
          elif [ -s notes.md ]; then
            gh release create "$TAG" ssmconnector.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" ssmconnector.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
